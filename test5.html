<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — Test 5</title><style>body{margin:0;background:#f3f6fb;color:#17233b;font:16px system-ui,-apple-system,sans-serif}main{max-width:740px;margin:20px auto;padding:14px}.panel{background:white;border-radius:17px;padding:22px;margin-bottom:15px;box-shadow:0 4px 18px #22334410}h1{margin:5px 0}small{color:#64748b}button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;border-radius:11px;padding:13px;background:white;color:inherit}button:disabled{opacity:.45}.option{display:block;width:100%;text-align:left;margin:9px 0;line-height:1.5}.good{background:#dcfce7;border:2px solid #16a34a}.bad{background:#fee2e2;border:2px solid #dc2626}.primary{background:#1d4ed8;color:white;border:0}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.feedback{background:#f1f5f9;padding:15px;border-radius:12px;margin-top:15px}.track{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2563eb;width:0}li{margin:7px 0}</style></head><body><main><section class="panel"><small>TCF CANADA · RÉVISION DES RÉPONSES</small><h1>Test 5</h1><p>Questions 31–39 · Instant feedback · English meanings</p><div class="track"><div class="fill" id="fill"></div></div><p id="progress"></p></section><section class="panel" id="quiz"></section></main><script>
const questions=[
[31,['Manger de tout, y compris ce qu’il n’aime pas.','Cesser de consommer du pain ou des féculents.','Manger plus léger sans changer ses habitudes.','Se garder de consommer des aliments sucrés.'],['Eat everything, including foods he dislikes.','Stop consuming bread or starchy foods.','Eat lighter without changing his habits.','Avoid eating sugary foods.'],2],
[32,['La diversité des parlers régionaux des personnages.','La mise en relief des formules figées de la langue.','Le recours constant au registre familier.','Les jeux de mots récurrents dans les titres.'],['Diversity of the characters’ regional speech.','Highlighting fixed expressions in the language.','Constant use of informal language.','Recurring wordplay in titles.'],1],
[33,['Augmenter la fréquentation des théâtres.','Créer une troupe de théâtre indépendante.','Déterminer les nouveaux enjeux du théâtre.','Jouer dans des pièces de théâtre inédites.'],['Increase theatre attendance.','Create an independent theatre company.','Identify the new challenges facing theatre.','Perform in new or previously unproduced plays.'],2],
[34,['De prendre ouvertement position dans des rivalités internes.','De se confier à tous ses collègues avant de les connaître.','De trop faire valoir ses compétences pour montrer sa supériorité.','De vouloir participer à tous les projets sans vraiment s’investir.'],['Openly take sides in internal rivalries.','Confide in all colleagues before knowing them.','Overemphasize skills to show superiority.','Want to participate in every project without truly committing.'],0],
[35,['De nouveaux modes de culture.','Des circuits de distribution courts.','Des contrôles sanitaires plus rapides.','Des systèmes de production innovants.'],['New cultivation methods.','Short distribution channels.','Faster sanitary inspections.','Innovative production systems.'],1],
[36,['L’intérêt principal de sa mise en place a disparu.','Le ministère manque de moyens pour l’organiser.','Le taux de réussite des candidats est en baisse.','Le nombre de fraudes constatées augmente.'],['The main purpose for introducing it has disappeared.','The ministry lacks resources to organize it.','The candidates’ success rate is declining.','Detected fraud cases are increasing.'],0],
[37,['Les bâtiments restaurés sont en nombre insuffisant.','Les cités réaménagées sont surtout résidentielles.','Les municipalités privilégient les projets coûteux.','Les réhabilitations ont une portée limitée.'],['There are too few restored buildings.','Redeveloped areas are mainly residential.','Municipalities favor expensive projects.','The rehabilitation projects have limited impact.'],3],
[38,['L’accès à la reconnaissance sociale est conditionné par le travail.','La réalisation de soi par le travail est devenue une obligation.','Les responsabilités au travail sont considérées comme des priorités absolues.','Le travail est systématiquement opposé à l’épanouissement personnel.'],['Access to social recognition depends on work.','Self-fulfilment through work has become an obligation.','Work responsibilities are considered absolute priorities.','Work is systematically opposed to personal fulfilment.'],1],
[39,['Elle est trop éloignée des orientations politiques actuelles.','Elle fait référence à des événements historiques douloureux.','Elle fait ressurgir des rivalités ou des antagonismes oubliés.','Elle remet en cause la domination de fait de certains pays.'],['It is too far removed from current political directions.','It refers to painful historical events.','It revives forgotten rivalries or antagonisms.','It challenges the de facto dominance of certain countries.'],0]
];
let index=0,answers={};try{answers=JSON.parse(localStorage.getItem('tcf5answers')||'{}')}catch(e){}const quiz=document.getElementById('quiz');function save(){try{localStorage.setItem('tcf5answers',JSON.stringify(answers))}catch(e){}}function render(){let q=questions[index],selected=answers[q[0]],done=selected!==undefined;document.getElementById('progress').textContent=Object.keys(answers).length+' of 9 answered';document.getElementById('fill').style.width=(Object.keys(answers).length/9*100)+'%';quiz.innerHTML='<small>QUESTION '+(index+1)+' / 9</small><h2>Question '+q[0]+'</h2><p>Choisissez la bonne réponse.</p>'+q[1].map((v,j)=>'<button class="option '+(done&&j===q[3]?'good':done&&j===selected?'bad':'')+'" data-choice="'+j+'" '+(done?'disabled':'')+'><b>'+('ABCD'[j])+'.</b> '+v+'</button>').join('')+(done?'<div class="feedback"><b>'+(selected===q[3]?'✓ Correcte !':'✗ Incorrecte')+'</b><p><b>Bonne réponse : '+('ABCD'[q[3]])+'</b> — '+q[1][q[3]]+'</p><p><b>English:</b> '+q[2][q[3]]+'</p><details><summary>English meanings of all options</summary><ol type="A">'+q[2].map(x=>'<li>'+x+'</li>').join('')+'</ol></details></div>':'')+'<div class="nav"><button id="back" '+(index===0?'disabled':'')+'>Previous</button><button class="primary" id="forward" '+(!done?'disabled':'')+'>'+(index===8?'See score':'Next →')+'</button></div>';quiz.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[q[0]]=Number(b.dataset.choice);save();render()});document.getElementById('back').onclick=()=>{index--;render()};document.getElementById('forward').onclick=()=>{if(index===8)results();else{index++;render()}}}function results(){let score=questions.filter(q=>answers[q[0]]===q[3]).length;quiz.innerHTML='<h2>Your score: '+score+'/9</h2>'+questions.map(q=>'<p><b>Question '+q[0]+': '+('ABCD'[q[3]])+'</b> — '+q[1][q[3]]+'<br><small>'+q[2][q[3]]+' · '+(answers[q[0]]===q[3]?'Correct':'Incorrect')+'</small></p>').join('')+'<button class="primary" id="retry">Retry Test 5</button>';document.getElementById('retry').onclick=()=>{answers={};index=0;save();render()}}render();
</script></body></html>
