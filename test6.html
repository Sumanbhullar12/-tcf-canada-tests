<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — Test 6</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#18233b;margin:0}main{max-width:760px;margin:auto;padding:20px}.panel{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #0001}button,.link{display:block;box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border:1px solid #d0d8e5;border-radius:10px;background:white;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2155ce;color:white;text-align:center}.muted{color:#64748b}.row{display:flex;gap:10px}.row>*{flex:1}summary{cursor:pointer}</style></head><body><main><a href="index.html">← Dashboard</a><h1>TCF Canada · Test 6</h1><div id="root"></div></main><script>const questions=[[31, ["D’une compétition sportive.", "D’une croisière maritime.", "D’une histoire familiale.", "D’une rencontre amoureuse."], ["About a sports competition.", "About a sea cruise.", "About a family story.", "About a romantic encounter."], 2], [32, ["Ils nagent en plein air dans la capitale.", "Ils s’amusent dans un parc d’attractions.", "Ils se retrouvent à la piscine municipale.", "Ils sont en vacances au bord de la mer."], ["They swim outdoors in the capital.", "They have fun at an amusement park.", "They meet at the municipal swimming pool.", "They are on holiday by the sea."], 0], [33, ["De la particularité de sa voix.", "De la reprise d’une œuvre.", "De sa nouvelle tournée.", "De son dernier rôle au cinéma."], ["About the distinctive quality of their voice.", "About a revival or new interpretation of a work.", "About their new tour.", "About their latest film role."], 1], [34, ["Ils consomment plus que la jeune génération.", "Ils dépensent beaucoup pour leur santé.", "Ils profitent peu des effets de la croissance.", "Ils sont à l’origine de créations d’emplois."], ["They consume more than the younger generation.", "They spend a lot on their health.", "They benefit little from economic growth.", "They contribute to job creation."], 3], [35, ["Il considère que le phénomène doit être analysé.", "Il conteste les méthodes de collecte des données.", "Il partage la vision catastrophiste des écologistes.", "Il s’oppose aux décisions du gouvernement."], ["He believes the phenomenon should be analyzed.", "He disputes the data collection methods.", "He shares environmentalists’ catastrophic outlook.", "He opposes government decisions."], 0], [36, ["Ils améliorent les facultés d’attention.", "Ils entravent la liberté de penser.", "Ils assurent les travaux fastidieux.", "Ils diminuent les aptitudes cognitives."], ["They improve attention abilities.", "They hinder freedom of thought.", "They handle tedious tasks.", "They reduce cognitive abilities."], 2], [37, ["Le nombre de médiateurs est insuffisant pour répondre à la demande.", "Les banques influencent les décisions prises par les médiateurs.", "Les demandeurs trouvent que la procédure est trop longue et compliquée.", "Quelle que soit la nature du litige, le médiateur n’a qu’un pouvoir consultatif."], ["There are not enough mediators to meet demand.", "Banks influence mediators’ decisions.", "Applicants find the procedure too long and complicated.", "Whatever the nature of the dispute, the mediator only has an advisory role."], 3], [38, ["Les remplacer par des copies de qualité.", "Les rénover selon les techniques originales.", "Les reproduire avec des matériaux identiques.", "Leur substituer des créations contemporaines."], ["Replace them with high-quality copies.", "Renovate them using the original techniques.", "Reproduce them using identical materials.", "Replace them with contemporary creations."], 3], [39, ["La fragilité de l’engagement.", "La multiplicité des contacts.", "La pauvreté des échanges.", "L’absence du face-à-face."], ["The fragility of commitment.", "The multitude of contacts.", "The shallowness of exchanges.", "The absence of face-to-face interaction."], 0]];let answers={},idx=0;try{answers=JSON.parse(localStorage.getItem('tcf6answers')||'{}')}catch(e){}const root=document.getElementById('root');function save(){localStorage.setItem('tcf6answers',JSON.stringify(answers))}function render(){let q=questions[idx],chosen=answers[q[0]],done=chosen!==undefined;root.innerHTML='<div class="panel"><p class="muted">Question '+(idx+1)+' of 9 · Question '+q[0]+'</p><h2>Écoutez le document sonore et la question.</h2><p class="muted">Audio not included in screenshots. Choose the correct answer.</p>'+q[1].map((x,j)=>'<button class="'+(done?(j===q[3]?'correct':j===chosen?'wrong':''):'')+'" data-a="'+j+'" '+(done?'disabled':'')+'><b>'+('ABCD'[j])+'.</b> '+x+'</button>').join('')+(done?'<div class="panel"><b>'+(chosen===q[3]?'✓ Correcte':'✗ Incorrecte')+'</b><p>Bonne réponse : '+('ABCD'[q[3]])+'</p><details><summary>English meanings of all options</summary><ol type="A">'+q[2].map(x=>'<li>'+x+'</li>').join('')+'</ol></details></div>':'')+'<div class="row"><button id="prev" '+(idx===0?'disabled':'')+'>Previous</button><button class="primary" id="next" '+(!done?'disabled':'')+'>'+(idx===8?'See score':'Next →')+'</button></div></div>';root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{answers[q[0]]=Number(b.dataset.a);save();render()});document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{if(idx===8)result();else{idx++;render()}}}function result(){let score=questions.filter(q=>answers[q[0]]===q[3]).length;localStorage.setItem('tcf6latest',String(score));root.innerHTML='<div class="panel"><h2>Test 6 completed</h2><h1>'+score+'/9</h1><p>Latest score saved on this browser.</p><a class="link" href="index.html">← Dashboard</a><button class="primary" id="retry">Retry Test 6</button></div>';document.getElementById('retry').onclick=()=>{answers={};idx=0;save();render()}}render();</script></body></html>
