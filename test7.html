<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — Test 7</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#18233b;margin:0}main{max-width:760px;margin:auto;padding:20px}.panel{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #0001}button,.link{display:block;box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border:1px solid #d0d8e5;border-radius:10px;background:white;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2155ce;color:white;text-align:center}.muted{color:#64748b}.row{display:flex;gap:10px}.row>*{flex:1}summary{cursor:pointer}</style></head><body><main><a href="index.html">← Dashboard</a><h1>TCF Canada · Test 7</h1><div id="root"></div></main><script>const questions=[[31, ["Aujourd’hui, être à la mode est une préoccupation superficielle.", "Il faut porter des vêtements adaptés à toutes circonstances.", "La société actuelle donne trop de place à l’apparence.", "La tenue vestimentaire influence l’état psychologique."], ["Today, being fashionable is a superficial concern.", "People should wear clothes suited to every situation.", "Today's society places too much importance on appearance.", "Clothing influences one's psychological state."], 3], [32, ["Elle donne l’occasion de découvrir de jeunes talents.", "Elle offre une expérience à un public de tous âges.", "Elle permet de jouer sur scène avec son enfant.", "Elle présente la même pièce en différentes langues."], ["It provides an opportunity to discover young talents.", "It offers an experience for audiences of all ages.", "It allows you to perform on stage with your child.", "It presents the same play in different languages."], 1], [33, ["L’assujettissement insidieux des mineurs.", "L’insuffisance d’information des parents.", "La fatigue occasionnée chez les enfants.", "Le manque d’intérêt éducatif de l’activité."], ["The subtle subjugation of minors.", "Parents' lack of information.", "The fatigue caused in children.", "The activity's lack of educational value."], 0], [34, ["Un accès plus large aux fonds de la bibliothèque municipale.", "Un contrat permettant de combiner différents types d’abonnements.", "Un contrôle renforcé de l’identité des usagers des services de la ville.", "Une modernisation des procédures d’emprunt des documents."], ["Broader access to the municipal library's collections.", "An agreement allowing different subscription types to be combined.", "Stricter identity checks for users of city services.", "Modernization of document borrowing procedures."], 3], [35, ["Elle commercialise des produits dangereux pour la santé.", "Elle crée des besoins pour réutiliser de vieux remèdes.", "Elle fait des profits grâce à la vente de traitements périmés.", "Elle limite la recherche consacrée aux pathologies rares."], ["It markets products that are dangerous to health.", "It creates demand to reuse old remedies.", "It profits from selling expired treatments.", "It limits research devoted to rare diseases."], 1], [36, ["Leur aménagement doit suivre un modèle vertical.", "Leur conception doit s’affranchir des modes du passé.", "Leur développement est une menace pour l’environnement.", "Leur expansion est loin d’être un phénomène inéluctable."], ["Their layout must follow a vertical model.", "Their design must break free from past fashions.", "Their development threatens the environment.", "Their expansion is far from inevitable."], 1], [37, ["Sur des considérations morales.", "Sur des convictions écologiques.", "Sur des certitudes économiques.", "Sur des prescriptions diététiques."], ["On moral considerations.", "On ecological convictions.", "On economic certainties.", "On dietary recommendations."], 0], [38, ["Comme un prétexte pour éviter de traiter les questions significatives.", "Comme une occasion de commenter ce qui ne va pas dans notre société.", "Comme un moyen de sensibiliser le public aux problèmes des individus.", "Comme une façon de distraire les individus de leurs petits soucis quotidiens."], ["As an excuse to avoid addressing important issues.", "As an opportunity to comment on what is wrong with our society.", "As a way to raise public awareness of people's problems.", "As a way to distract people from their small everyday worries."], 0], [39, ["En regroupant les œuvres selon un ordre chronologique.", "En regroupant les tableaux dans une même salle.", "En regroupant les toiles autour d’un même sujet.", "En regroupant ses créations avec celles d’autres artistes."], ["By grouping works in chronological order.", "By grouping the paintings in the same room.", "By grouping paintings around the same subject.", "By grouping their creations with those of other artists."], 2]];let answers={},idx=0;try{answers=JSON.parse(localStorage.getItem('tcf7answers')||'{}')}catch(e){}const root=document.getElementById('root');function save(){localStorage.setItem('tcf7answers',JSON.stringify(answers))}function render(){let q=questions[idx],chosen=answers[q[0]],done=chosen!==undefined;root.innerHTML='<div class="panel"><p class="muted">Question '+(idx+1)+' of 9 · Question '+q[0]+'</p><h2>Écoutez le document sonore et la question.</h2><p class="muted">Audio not included in screenshots. Choose the correct answer.</p>'+q[1].map((x,j)=>'<button class="'+(done?(j===q[3]?'correct':j===chosen?'wrong':''):'')+'" data-a="'+j+'" '+(done?'disabled':'')+'><b>'+('ABCD'[j])+'.</b> '+x+'</button>').join('')+(done?'<div class="panel"><b>'+(chosen===q[3]?'✓ Correcte':'✗ Incorrecte')+'</b><p>Bonne réponse : '+('ABCD'[q[3]])+'</p><details><summary>English meanings of all options</summary><ol type="A">'+q[2].map(x=>'<li>'+x+'</li>').join('')+'</ol></details></div>':'')+'<div class="row"><button id="prev" '+(idx===0?'disabled':'')+'>Previous</button><button class="primary" id="next" '+(!done?'disabled':'')+'>'+(idx===8?'See score':'Next →')+'</button></div></div>';root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{answers[q[0]]=Number(b.dataset.a);save();render()});document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{if(idx===8)result();else{idx++;render()}}}function result(){let score=questions.filter(q=>answers[q[0]]===q[3]).length;localStorage.setItem('tcf7latest',String(score));root.innerHTML='<div class="panel"><h2>Test 7 completed</h2><h1>'+score+'/9</h1><p>Latest score saved on this browser.</p><a class="link" href="index.html">← Dashboard</a><button class="primary" id="retry">Retry Test 7</button></div>';document.getElementById('retry').onclick=()=>{answers={};idx=0;save();render()}}render();</script></body></html>
