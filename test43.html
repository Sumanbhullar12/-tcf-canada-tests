<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — Test 43</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#18233b;margin:0}main{max-width:760px;margin:auto;padding:20px}.panel{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #0001}button,.link{display:block;box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border:1px solid #d0d8e5;border-radius:10px;background:white;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2155ce;color:white;text-align:center}.muted{color:#64748b}.row{display:flex;gap:10px}.row>*{flex:1}summary{cursor:pointer}</style></head><body><main><a href="index.html">← Dashboard</a><h1>TCF Canada · Test 43</h1><div id="root"></div></main><script>const questions=[[31, ["Toute traduction automatique doit être interdite, même pour le repérage.", "Une traduction rapide peut être utilisée sans indiquer son origine.", "L’outil peut assister le travail si la version officielle reste vérifiable et attribuable.", "Les interprètes humains deviennent inutiles dès que le système est rapide."], ["All automatic translation must be banned, even for initial identification.", "A quick translation may be used without disclosing its origin.", "The tool can assist work if the official version remains verifiable and attributable.", "Human interpreters become unnecessary as soon as the system is fast."], 2], [32, ["L’effet dépend de l’attention portée au moment et de l’usage ultérieur des images.", "Prendre une photographie améliore automatiquement chaque souvenir.", "Les souvenirs disparaissent dès qu’une personne utilise son téléphone.", "Consulter des images anciennes empêche de raconter un événement."], ["The effect depends on attention paid in the moment and how images are later used.", "Taking a photograph automatically improves every memory.", "Memories disappear as soon as someone uses their phone.", "Looking at old images prevents someone from recounting an event."], 0], [33, ["Toute marque du temps doit être effacée immédiatement.", "L’entretien peut être confié sans consulter les artistes.", "Les nouvelles œuvres doivent remplacer toutes celles qui vieillissent.", "La conservation demande un arbitrage entre intention artistique, sécurité et responsabilité publique."], ["Every sign of aging must be erased immediately.", "Maintenance can be entrusted to others without consulting the artists.", "New artworks must replace all those that age.", "Conservation requires balancing artistic intention, safety and public responsibility."], 3], [34, ["Une batterie collective élimine tout besoin de règles de partage.", "Les locataires ne participent jamais au financement du système.", "La gouvernance doit équilibrer contribution, équité et réserve de sécurité.", "Toute l’électricité doit être vendue dès que le prix augmente."], ["A shared battery eliminates any need for sharing rules.", "Tenants never contribute to financing the system.", "Governance must balance contributions, fairness and a safety reserve.", "All electricity must be sold as soon as the price rises."], 2], [35, ["Il augmente immédiatement la croissance des branches.", "Il limite l’air, l’eau et le développement des racines.", "Il protège les racines contre tous les véhicules.", "Il permet de retourner la terre sans précaution."], ["It immediately increases branch growth.", "It restricts air, water and root development.", "It protects roots from all vehicles.", "It allows the soil to be turned without precautions."], 1], [36, ["Les données historiques rendent automatiquement toute prévision objective.", "Il suffit de retirer le nom du quartier pour supprimer les biais.", "Les habitants ne doivent pas connaître les critères de surveillance.", "L’évaluation doit examiner les boucles institutionnelles et les effets, pas seulement la précision."], ["Historical data automatically make every prediction objective.", "Removing the neighborhood name is enough to eliminate bias.", "Residents must not know the surveillance criteria.", "Evaluation must examine institutional feedback loops and effects, not just accuracy."], 3], [37, ["Mettre en place un consentement évolutif, une gouvernance indépendante et une information honnête sur les limites du retrait.", "Obtenir une autorisation générale irrévocable couvrant tous les usages futurs.", "Demander aux chercheurs de ne jamais partager de résultats.", "Exclure les participants des décisions concernant les usages commerciaux."], ["Establish ongoing consent, independent governance and honest information about the limits of withdrawal.", "Obtain irrevocable blanket authorization for all future uses.", "Ask researchers never to share results.", "Exclude participants from decisions about commercial uses."], 0], [38, ["Transformer chaque bureau sans étude préalable.", "Supprimer les exigences de lumière et de ventilation.", "Réserver toutes les conversions à des logements de luxe.", "Cibler les bâtiments adaptés et encadrer les transformations pour préserver la qualité et l’abordabilité."], ["Convert every office without a preliminary study.", "Remove lighting and ventilation requirements.", "Reserve all conversions for luxury housing.", "Target suitable buildings and regulate conversions to preserve quality and affordability."], 3], [39, ["La décision humaine finale suffit à neutraliser tout biais du classement.", "L’employeur doit contrôler l’objectif, les écarts, les recours et les résultats du système.", "Un modèle est équitable dès qu’il traite chaque dossier de façon identique.", "Le fournisseur assume seul les conséquences des candidatures rejetées."], ["A final human decision is enough to neutralize all ranking bias.", "The employer must monitor the objective, disparities, appeals and outcomes of the system.", "A model is fair as long as it treats every application identically.", "The provider alone bears the consequences of rejected applications."], 1]];let answers={},idx=0;try{answers=JSON.parse(localStorage.getItem('tcf43answers')||'{}')}catch(e){}const root=document.getElementById('root');function save(){localStorage.setItem('tcf43answers',JSON.stringify(answers))}function render(){let q=questions[idx],chosen=answers[q[0]],done=chosen!==undefined;root.innerHTML='<div class="panel"><p class="muted">Question '+(idx+1)+' of 9 · Question '+q[0]+'</p><h2>Écoutez le document sonore et la question.</h2><p class="muted">Audio not included in screenshots. Choose the correct answer.</p>'+q[1].map((x,j)=>'<button class="'+(done?(j===q[3]?'correct':j===chosen?'wrong':''):'')+'" data-a="'+j+'" '+(done?'disabled':'')+'><b>'+('ABCD'[j])+'.</b> '+x+'</button>').join('')+(done?'<div class="panel"><b>'+(chosen===q[3]?'✓ Correcte':'✗ Incorrecte')+'</b><p>Bonne réponse : '+('ABCD'[q[3]])+'</p><details><summary>English meanings of all options</summary><ol type="A">'+q[2].map(x=>'<li>'+x+'</li>').join('')+'</ol></details></div>':'')+'<div class="row"><button id="prev" '+(idx===0?'disabled':'')+'>Previous</button><button class="primary" id="next" '+(!done?'disabled':'')+'>'+(idx===8?'See score':'Next →')+'</button></div></div>';root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{answers[q[0]]=Number(b.dataset.a);save();render()});document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{if(idx===8)result();else{idx++;render()}}}function result(){let score=questions.filter(q=>answers[q[0]]===q[3]).length;localStorage.setItem('tcf43latest',String(score));root.innerHTML='<div class="panel"><h2>Test 43 completed</h2><h1>'+score+'/9</h1><p>Latest score saved on this browser.</p><a class="link" href="index.html">← Dashboard</a><button class="primary" id="retry">Retry Test 43</button></div>';document.getElementById('retry').onclick=()=>{answers={};idx=0;save();render()}}render();</script></body></html>
