<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — Test 8</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#18233b;margin:0}main{max-width:760px;margin:auto;padding:20px}.panel{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #0001}button,.link{display:block;box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border:1px solid #d0d8e5;border-radius:10px;background:white;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2155ce;color:white;text-align:center}.muted{color:#64748b}.row{display:flex;gap:10px}.row>*{flex:1}summary{cursor:pointer}</style></head><body><main><a href="index.html">← Dashboard</a><h1>TCF Canada · Test 8</h1><div id="root"></div></main><script>const questions=[[31, ["C’est un temps de découverte et l’humanité.", "C’est une occasion de dépenser son énergie.", "C’est une opportunité d’apprécier la solitude.", "C’est une possibilité quotidienne d’évasion."], ["It is a time of discovery and humanity.", "It is an opportunity to expend one's energy.", "It is an opportunity to appreciate solitude.", "It is an everyday chance to escape."], 0], [32, ["Elles appuient leur gestion sur la concertation.", "Elles garantissent des évolutions de carrière.", "Elles œuvrent dans des secteurs traditionnels.", "Elles s’engagent dans des projets audacieux."], ["They base their management on consultation and collaboration.", "They guarantee career advancement.", "They operate in traditional sectors.", "They undertake bold projects."], 0], [33, ["La conférence qui a eu lieu est uniquement symbolique.", "La secrétaire d’État a fait part de son pessimisme.", "Les discussions s’annoncent longues et difficiles.", "Tous les points de l’accord ont déjà été traités sans succès."], ["The conference that took place is purely symbolic.", "The Secretary of State expressed her pessimism.", "The discussions are expected to be long and difficult.", "All points of the agreement have already been addressed unsuccessfully."], 2], [34, ["Durcir les normes appliquées à la fabrication de voitures.", "Inciter les usagers à pratiquer d’autres modes de déplacement.", "Pousser les industriels à employer des technologies innovantes.", "Rendre obligatoire l’utilisation de carburants propres."], ["Tighten standards for car manufacturing.", "Encourage users to adopt other modes of transport.", "Encourage manufacturers to use innovative technologies.", "Make the use of clean fuels compulsory."], 1], [35, ["Animer des ateliers d’écriture thématiques.", "Faire connaître de jeunes philosophes talentueux.", "Organiser des lecteurs pendant les repas de midi.", "Trouver des solutions aux difficultés quotidiennes."], ["Run themed writing workshops.", "Introduce talented young philosophers to the public.", "Organize reading sessions during lunch breaks.", "Find solutions to everyday difficulties."], 3], [36, ["Favoriser la visibilité des ouvrages peu accessibles.", "Intervenir dans le choix des publications à venir.", "Modifier notre regard sur les livres « grand public ».", "Soutenir les petits éditeurs et leurs parutions."], ["Increase the visibility of books that are hard to access.", "Influence the choice of future publications.", "Change how we view mainstream books.", "Support small publishers and their new releases."], 0], [37, ["La relation liant Camille Claudel et Rodin.", "La richesse du musée Auguste Rodin.", "Les difficultés rencontrées par Rodin.", "Les sources d’inspiration de Rodin."], ["The relationship between Camille Claudel and Rodin.", "The richness of the Auguste Rodin Museum.", "The difficulties Rodin encountered.", "Rodin's sources of inspiration."], 0], [38, ["Ils font l’objet de manipulations douteuses par les pollueurs.", "Ils répondent à des critères insuffisamment exigeants.", "Ils sont destinés à justifier les politiques économiques.", "Ils sont publiés par des organismes liés aux entreprises."], ["They are subject to questionable manipulation by polluters.", "They meet standards that are not demanding enough.", "They are intended to justify economic policies.", "They are published by organizations linked to businesses."], 1], [39, ["La réalisation est trop extravagante.", "L’actrice principale est omniprésente.", "Le montage manque de cohérence.", "Le scénario manque de singularité."], ["The directing/production is too extravagant.", "The lead actress is everywhere in the film.", "The editing lacks coherence.", "The screenplay lacks originality."], 3]];let answers={},idx=0;try{answers=JSON.parse(localStorage.getItem('tcf8answers')||'{}')}catch(e){}const root=document.getElementById('root');function save(){localStorage.setItem('tcf8answers',JSON.stringify(answers))}function render(){let q=questions[idx],chosen=answers[q[0]],done=chosen!==undefined;root.innerHTML='<div class="panel"><p class="muted">Question '+(idx+1)+' of 9 · Question '+q[0]+'</p><h2>Écoutez le document sonore et la question.</h2><p class="muted">Audio not included in screenshots. Choose the correct answer.</p>'+q[1].map((x,j)=>'<button class="'+(done?(j===q[3]?'correct':j===chosen?'wrong':''):'')+'" data-a="'+j+'" '+(done?'disabled':'')+'><b>'+('ABCD'[j])+'.</b> '+x+'</button>').join('')+(done?'<div class="panel"><b>'+(chosen===q[3]?'✓ Correcte':'✗ Incorrecte')+'</b><p>Bonne réponse : '+('ABCD'[q[3]])+'</p><details><summary>English meanings of all options</summary><ol type="A">'+q[2].map(x=>'<li>'+x+'</li>').join('')+'</ol></details></div>':'')+'<div class="row"><button id="prev" '+(idx===0?'disabled':'')+'>Previous</button><button class="primary" id="next" '+(!done?'disabled':'')+'>'+(idx===8?'See score':'Next →')+'</button></div></div>';root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{answers[q[0]]=Number(b.dataset.a);save();render()});document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{if(idx===8)result();else{idx++;render()}}}function result(){let score=questions.filter(q=>answers[q[0]]===q[3]).length;localStorage.setItem('tcf8latest',String(score));root.innerHTML='<div class="panel"><h2>Test 8 completed</h2><h1>'+score+'/9</h1><p>Latest score saved on this browser.</p><a class="link" href="index.html">← Dashboard</a><button class="primary" id="retry">Retry Test 8</button></div>';document.getElementById('retry').onclick=()=>{answers={};idx=0;save();render()}}render();</script></body></html>
