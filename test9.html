nt.createElement('button');b.className='opt';b.innerHTML='<strong>'+String.fromCharCode(65+j)+'.</strong> '+o.fr+'<small>'+o.en+'</small>';b.onclick=()=>{if(choices[i]!==undefined)return;choices[i]=j;render()};if(choices[i]!==undefined){b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===choices[i])b.classList.add('wrong')}s.append(b)});if(choices[i]!==undefined){let f=document.createElement('p');f.className='feedback';f.textContent=choices[i]===q.correct?'✓ Correcte!':'✗ Incorrecte. Bonne réponse : '+String.fromCharCode(65+q.correct);s.append(f)}quiz.append(s)});document.getElementById('score').textContent='Score: '+questions.filter((q,i)=>choices[i]===q.correct).length+' / 9 · Answered '+Object.keys(choices).length+' / 9'}document.getElementById('retry').onclick=()=>{choices={};render();scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
