<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — Test 44</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#18233b;margin:0}main{max-width:760px;margin:auto;padding:20px}.panel{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #0001}button,.link{display:block;box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border:1px solid #d0d8e5;border-radius:10px;background:white;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2155ce;color:white;text-align:center}.muted{color:#64748b}.row{display:flex;gap:10px}.row>*{flex:1}summary{cursor:pointer}</style></head><body><main><a href="index.html">← Dashboard</a><h1>TCF Canada · Test 44</h1><div id="root"></div></main><script>const questions=[[31, ["Remplacer tous les arbres adultes par de jeunes espèces identiques.", "Évaluer une politique uniquement selon le nombre d’arbres plantés.", "Associer plantation, entretien, diversité et équité territoriale.", "Réserver les espaces ombragés aux quartiers déjà les plus végétalisés."], ["Replace all mature trees with young trees of identical species.", "Evaluate a policy only by the number of trees planted.", "Combine planting, maintenance, diversity and fairness across areas.", "Reserve shaded spaces for neighborhoods that already have the most greenery."], 2], [32, ["Remplacer entièrement l’enseignant par les étudiants.", "Donner automatiquement la même note à tous les travaux.", "Faire de l’évaluation une activité d’apprentissage encadrée et vérifiée.", "Éviter d’expliquer les critères afin de préserver la spontanéité."], ["Replace the teacher entirely with students.", "Automatically give every assignment the same grade.", "Make assessment a supervised and verified learning activity.", "Avoid explaining the criteria to preserve spontaneity."], 2], [33, ["La manière d’utiliser les revenus de la taxe carbone.", "Le montant des salaires dans le secteur du transport.", "La suppression de toutes les aides au logement.", "La construction de nouvelles routes pour les voitures."], ["How carbon-tax revenue is used.", "The amount of wages in the transport sector.", "The elimination of all housing assistance.", "The construction of new roads for cars."], 0], [34, ["Évaluer le projet uniquement après la première pluie.", "Mesurer seulement le nombre de plantes installées.", "Présenter les milieux humides comme une protection absolue.", "Suivre plusieurs effets dans le temps et situer la restauration parmi d’autres mesures."], ["Evaluate the project only after the first rainfall.", "Measure only the number of plants installed.", "Present wetlands as absolute protection.", "Monitor several effects over time and place restoration alongside other measures."], 3], [35, ["La hausse moyenne prouve que chaque commerce est gagnant.", "La fermeture doit être jugée avec plusieurs sources et selon la distribution de ses effets.", "Les entretiens peuvent remplacer toutes les données de fréquentation.", "Les rues voisines ne doivent jamais être incluses dans l’analyse."], ["An average increase proves every business benefits.", "The closure must be assessed using multiple sources and by how its effects are distributed.", "Interviews can replace all visitor-count data.", "Neighboring streets must never be included in the analysis."], 1], [36, ["Collecter le maximum de données au cas où elles seraient utiles.", "Considérer toute donnée sans nom comme parfaitement anonyme.", "Limiter les données à la finalité annoncée et soumettre les usages à un contrôle collectif.", "Utiliser les capteurs d’énergie pour classer la présence individuelle."], ["Collect as much data as possible in case it becomes useful.", "Consider any data without a name to be perfectly anonymous.", "Limit data to the stated purpose and subject its use to collective oversight.", "Use energy sensors to classify individual presence."], 2], [37, ["Les recherches sont prometteuses mais exigent prudence et personnalisation.", "Un seul probiotique convient déjà à tous les patients.", "Le microbiote n’a aucun lien avec le fonctionnement du corps.", "Les produits commerciaux ont tous démontré leur efficacité."], ["Research is promising but requires caution and personalization.", "One probiotic already suits all patients.", "The microbiome has no link to how the body functions.", "All commercial products have demonstrated their effectiveness."], 0], [38, ["Les cartes permettent de prévoir exactement chaque future inondation.", "Les propriétaires ne doivent connaître que le montant de leur prime.", "La communication doit expliquer le risque, les hypothèses et les moyens d’action.", "Les assureurs renoncent à utiliser les données climatiques."], ["Maps can predict every future flood exactly.", "Property owners only need to know their premium amount.", "Communication must explain the risk, assumptions and possible actions.", "Insurers are giving up using climate data."], 2], [39, ["Une reconstruction authentique doit toujours reproduire une seule date précise.", "La sécurité contemporaine doit être ignorée pour respecter le passé.", "Le projet peut concilier continuité et changement en rendant ses choix et incertitudes lisibles.", "Il faut remplacer le marché par un bâtiment sans aucun lien avec son histoire."], ["An authentic reconstruction must always reproduce one precise date.", "Modern safety must be ignored to respect the past.", "The project can reconcile continuity and change by making its choices and uncertainties clear.", "The market must be replaced by a building with no connection to its history."], 2]];let answers={},idx=0;try{answers=JSON.parse(localStorage.getItem('tcf44answers')||'{}')}catch(e){}const root=document.getElementById('root');function save(){localStorage.setItem('tcf44answers',JSON.stringify(answers))}function render(){let q=questions[idx],chosen=answers[q[0]],done=chosen!==undefined;root.innerHTML='<div class="panel"><p class="muted">Question '+(idx+1)+' of 9 · Question '+q[0]+'</p><h2>Écoutez le document sonore et la question.</h2><p class="muted">Audio not included in screenshots. Choose the correct answer.</p>'+q[1].map((x,j)=>'<button class="'+(done?(j===q[3]?'correct':j===chosen?'wrong':''):'')+'" data-a="'+j+'" '+(done?'disabled':'')+'><b>'+('ABCD'[j])+'.</b> '+x+'</button>').join('')+(done?'<div class="panel"><b>'+(chosen===q[3]?'✓ Correcte':'✗ Incorrecte')+'</b><p>Bonne réponse : '+('ABCD'[q[3]])+'</p><details><summary>English meanings of all options</summary><ol type="A">'+q[2].map(x=>'<li>'+x+'</li>').join('')+'</ol></details></div>':'')+'<div class="row"><button id="prev" '+(idx===0?'disabled':'')+'>Previous</button><button class="primary" id="next" '+(!done?'disabled':'')+'>'+(idx===8?'See score':'Next →')+'</button></div></div>';root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{answers[q[0]]=Number(b.dataset.a);save();render()});document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{if(idx===8)result();else{idx++;render()}}}function result(){let score=questions.filter(q=>answers[q[0]]===q[3]).length;localStorage.setItem('tcf44latest',String(score));root.innerHTML='<div class="panel"><h2>Test 44 completed</h2><h1>'+score+'/9</h1><p>Latest score saved on this browser.</p><a class="link" href="index.html">← Dashboard</a><button class="primary" id="retry">Retry Test 44</button></div>';document.getElementById('retry').onclick=()=>{answers={};idx=0;save();render()}}render();</script></body></html>
