<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — My Tests</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#18233b;margin:0}main{max-width:760px;margin:auto;padding:20px}.panel{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #0001}button,.link{display:block;box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border:1px solid #d0d8e5;border-radius:10px;background:white;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2155ce;color:white;text-align:center}.muted{color:#64748b}.row{display:flex;gap:10px}.row>*{flex:1}summary{cursor:pointer}</style></head><body><main><h1>My TCF Canada Tests</h1><p class="muted">44 test slots · Latest score only · Progress saved in this browser</p><div class="panel"><h2 id="progress">0 of 44 completed</h2><p id="average" class="muted"></p></div><div id="tests"></div></main><script>const root=document.getElementById('tests');let completed=0, scores=[];for(let n=1;n<=44;n++){let available=n===5||n===6||n===7||n===8||n===9||n===10||n===11||n===12||n===43||n===44;let score=null;if(n>=9&&n<=12){let x=localStorage.getItem('tcf'+n+'latest');if(x!==null)score=Number(x)}if(n===8){let x=localStorage.getItem('tcf8latest');if(x!==null)score=Number(x)}if(n===43){let x=localStorage.getItem('tcf43latest');if(x!==null)score=Number(x)}if(n===44){let x=localStorage.getItem('tcf44latest');if(x!==null)score=Number(x)}if(n===7){let x=localStorage.getItem('tcf7latest');if(x!==null)score=Number(x)}if(n===6){let x=localStorage.getItem('tcf6latest');if(x!==null)score=Number(x)}if(n===5){try{let a=JSON.parse(localStorage.getItem('tcf5answers')||'{}');if(Object.keys(a).length===9){const correct=[2,1,2,0,1,0,3,1,0];score=correct.reduce((s,c,i)=>s+(a[i+31]===c?1:0),0)}}catch(e){}}if(score!==null){completed++;scores.push(score)}root.innerHTML+='<div class="panel"><h3>Test '+n+'</h3><p class="muted">'+(score!==null?'Completed · Latest score: '+score+'/9':available?'Available · Not completed':'Coming soon')+'</p>'+(available?'<a class="link" href="test'+n+'.html">'+(score!==null?'Retake':'Start')+' Test '+n+'</a>':'')+'</div>'}document.getElementById('progress').textContent=completed+' of 44 completed';document.getElementById('average').textContent=scores.length?'Average of completed tests: '+(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1)+'/9':'No completed tests yet';</script></body></html>
