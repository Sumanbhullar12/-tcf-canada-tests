<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada – Test 11 (31–39)</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#182334;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:#123c72;color:white;padding:24px;border-radius:16px}h1{margin:0 0 8px}section{background:white;margin:18px 0;padding:20px;border-radius:14px;box-shadow:0 2px 10px #15253a12}.option{display:block;width:100%;text-align:left;border:1px solid #dce2e9;background:#f6f7f9;border-radius:10px;margin:9px 0;padding:14px;font:inherit;color:inherit;cursor:pointer}.option:disabled{cursor:default}.correct{background:#d6f7df!important;border-color:#22a354!important}.wrong{background:#ffe0e0!important;border-color:#d44343!important}.feedback{font-weight:700;margin-top:12px}.en{color:#516174;font-size:.91em;margin-top:4px}.muted{color:#60718a}.num{color:#145da0;font-weight:700}#score{font-weight:700;margin:12px 0}#reset{background:#123c72;color:white;border:0;border-radius:10px;padding:13px 20px;font:inherit;cursor:pointer}</style></head><body><main><header><h1>TCF Canada · Test 11</h1><div>Compréhension orale · Questions 31–39</div><p>Choisissez une réponse. Vous verrez immédiatement la correction et la traduction anglaise.</p></header><p class="muted">Remarque : les enregistrements audio ne sont pas inclus dans les captures fournies. Ce test permet de réviser les choix de réponse.</p><div id="score" aria-live="polite"></div><div id="quiz"></div><button id="reset">Recommencer le test / Retry</button></main><script>
const data=[
{n:31,correct:1,options:[['Elle annonce de futures découvertes.','It announces future discoveries.'],['Elle confirme une théorie ancienne.','It confirms an old theory.'],['Elle illustre les progrès du matériel scientifique.','It illustrates advances in scientific equipment.'],['Elle permet la poursuite des travaux d’Einstein.','It allows Einstein’s work to continue.']]},
{n:32,correct:0,options:[['Elle est dans l’innovation constante.','It is constantly innovating.'],['Elle est tournée vers l’exotisme.','It is oriented toward exoticism.'],['Elle fait la part belle à la tradition.','It gives pride of place to tradition.'],['Elle nécessite un service très rapide.','It requires very fast service.']]},
{n:33,correct:3,options:[['Elle se heurte aux systèmes existants.','It comes up against existing systems.'],['Elle est complexe à développer en Europe.','It is difficult to develop in Europe.'],['Elle est soutenue par les grandes surfaces.','It is supported by large retailers.'],['Elle représente une solution d’avenir.','It represents a solution for the future.']]},
{n:34,correct:2,options:[['Pour accélérer la rénovation d’anciennes constructions.','To speed up the renovation of old buildings.'],['Pour comparer les styles des maisons nord-américaines.','To compare North American house styles.'],['Pour conserver la trace du patrimoine architectural.','To preserve a record of architectural heritage.'],['Pour dénoncer la dégradation des logements urbains.','To denounce the deterioration of urban housing.']]},
{n:35,correct:2,options:[['Ils desservent l’image des vedettes.','They damage the image of celebrities.'],['Ils génèrent des profits insuffisants.','They generate insufficient profits.'],['Ils programment les mêmes musiciens.','They book the same musicians.'],['Ils sont tous organisés pendant l’été.','They are all organized during summer.']]},
{n:36,correct:0,options:[['Les acheteurs.','Buyers.'],['Les commerçants.','Retailers / shopkeepers.'],['Les entreprises.','Businesses / companies.'],['Les pouvoirs publics.','Public authorities.']]},
{n:37,correct:2,options:[['Pour mettre en pratique ses connaissances.','To put one’s knowledge into practice.'],['Pour opérer une reconversion professionnelle.','To change careers.'],['Pour pouvoir rembourser son emprunt.','To be able to repay one’s loan.'],['Pour vivre quelques années à l’étranger.','To live abroad for a few years.']]},
{n:38,correct:1,options:[['Ils font l’objet de manipulations douteuses par les pollueurs.','They are subject to questionable manipulation by polluters.'],['Ils répondent à des critères insuffisamment exigeants.','They meet criteria that are not demanding enough.'],['Ils sont destinés à justifier les politiques économiques.','They are intended to justify economic policies.'],['Ils sont publiés par des organismes liés aux entreprises.','They are published by organizations linked to businesses.']]},
{n:39,correct:0,options:[['Le processus d’attractivité des cellules femelles.','The process by which female cells attract.'],['Les différences avec la reproduction des plantes terrestres.','Differences from the reproduction of land plants.'],['La constitution de certains organismes aquatiques.','The structure of certain aquatic organisms.'],['L’influence de la météorologie sur leur fécondation.','The influence of weather conditions on their fertilization.']]}
];
const answered={};const quiz=document.getElementById('quiz');function update(){let count=Object.keys(answered).length,correct=Object.entries(answered).filter(([n,v])=>data.find(q=>q.n==n).correct===v).length;document.getElementById('score').textContent=`Score : ${correct} / 9 · Répondu : ${count} / 9`;if(count===9)localStorage.setItem('tcf11latest',String(correct))}
function render(){quiz.innerHTML='';for(const q of data){const section=document.createElement('section');section.innerHTML=`<div class="num">Question ${q.n}</div><h2 style="font-size:1.12rem">Écoutez le document sonore et la question.</h2><p class="muted">Choisissez la bonne réponse.</p>`;q.options.forEach(([fr,en],i)=>{const btn=document.createElement('button');btn.className='option';btn.innerHTML=`<strong>${'ABCD'[i]}.</strong> ${fr}<div class="en">${en}</div>`;btn.addEventListener('click',()=>{if(q.n in answered)return;answered[q.n]=i;section.querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const fb=document.createElement('p');fb.className='feedback';fb.textContent=(i===q.correct?'✓ Correcte !':'✗ Incorrecte.')+` Bonne réponse : ${'ABCD'[q.correct]}.`;section.append(fb);update()});section.append(btn)});quiz.append(section)}update()}document.getElementById('reset').addEventListener('click',()=>{for(const k in answered)delete answered[k];render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
