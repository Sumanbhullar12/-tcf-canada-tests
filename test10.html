<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada — Test 10</title><style>body{margin:0;background:#f4f7fb;color:#1b2a3b;font-family:system-ui,-apple-system,sans-serif}main{max-width:820px;margin:auto;padding:18px}header{background:#163c70;color:white;border-radius:15px;padding:22px}h1{margin:0}section{background:white;border-radius:14px;margin:16px 0;padding:18px;box-shadow:0 2px 12px #0001}.opt{display:block;width:100%;text-align:left;border:1px solid #d9e0e9;border-radius:10px;background:#f8fafc;margin:8px 0;padding:13px;font:inherit;cursor:pointer}.opt small{display:block;color:#556779;margin:5px 0 0 25px}.opt.correct{background:#d8f6df;border-color:#24a052}.opt.wrong{background:#ffe0e0;border-color:#d73939}.feedback{font-weight:700;margin-top:8px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}button#retry{padding:12px 18px;border:0;border-radius:10px;background:#163c70;color:white;font-weight:700;cursor:pointer}p{line-height:1.5}</style></head><body><main><header><h1>TCF Canada — Test 10</h1><p>Compréhension orale · Questions 31–39</p><p>Practice using the answer choices shown in your screenshots. Audio recordings are not included.</p></header><div class="bar"><h2 id="score">Score: 0 / 9</h2><button id="retry">Retry</button></div><div id="quiz"></div><p><small>Practice reconstruction from screenshots; not an official TCF test.</small></p></main><script>const questions=[{"number": 31, "options": [{"fr": "Favoriser l’apprentissage de chansons françaises.", "en": "Encourage learning French songs."}, {"fr": "Montrer la variété de la langue française.", "en": "Show the diversity of the French language."}, {"fr": "Promouvoir de nouveaux événements musicaux.", "en": "Promote new musical events."}, {"fr": "Faire le tour du monde des festivals francophones.", "en": "Tour the world of Francophone festivals."}], "correct": 1}, {"number": 32, "options": [{"fr": "Apprendre à l’élève à se maîtriser sans la présence de professeurs.", "en": "Teach the student self-control without teachers."}, {"fr": "Imposer une progression précise à l’élève afin de l’aider à se structurer.", "en": "Impose a precise progression to provide structure."}, {"fr": "Laisser l’élève progresser à son rythme en l’accompagnant patiemment.", "en": "Let the student progress at their own pace with patient support."}, {"fr": "S’appuyer sur ce que l’élève a appris durant son parcours scolaire.", "en": "Build on what the student learned in school."}], "correct": 2}, {"number": 33, "options": [{"fr": "Contrôler l’aptitude à la conduite d’une certaine catégorie d’usagers.", "en": "Check driving ability of a category of road users."}, {"fr": "Obliger les fautifs d’accident à repasser l’examen du permis.", "en": "Require drivers at fault in accidents to retake the driving test."}, {"fr": "Réduire la vitesse réglementaire pour les automobilistes séniors.", "en": "Lower speed limits for senior drivers."}, {"fr": "Simplifier les panneaux de signalisation les plus complexes.", "en": "Simplify the most complex road signs."}], "correct": 0}, {"number": 34, "options": [{"fr": "Accroître les zones agricoles en déforestation.", "en": "Expand agricultural land through deforestation."}, {"fr": "Améliorer le rendement des parcelles cultivées.", "en": "Improve yields of cultivated plots."}, {"fr": "Exploiter différemment les terres endommagées.", "en": "Use damaged land differently."}, {"fr": "Rendre productifs les terrains vagues urbains.", "en": "Make vacant urban land productive."}], "correct": 2}, {"number": 35, "options": [{"fr": "C’est un exemple de réussite par le sport.", "en": "It is an example of success through sport."}, {"fr": "C’est un modèle rare de mixité culturelle.", "en": "It is a rare model of cultural diversity."}, {"fr": "C’est un symbole fort de cette province.", "en": "It is a strong symbol of this province."}, {"fr": "C’est une référence pour son style de jeu.", "en": "It is a reference for its playing style."}], "correct": 2}, {"number": 36, "options": [{"fr": "Constituer un atlas mondial électronique.", "en": "Create an electronic world atlas."}, {"fr": "Proposer des reportages sur la vie privée.", "en": "Offer reports on private lives."}, {"fr": "Recenser les plaintes pour violation d’intimité.", "en": "Record complaints about privacy violations."}, {"fr": "Surveiller les maisons pour stopper les vols.", "en": "Monitor homes to stop thefts."}], "correct": 0}, {"number": 37, "options": [{"fr": "L’industrialisation galopante des rives.", "en": "Rapid industrialization of riverbanks."}, {"fr": "La dégradation d’un site naturel rare.", "en": "Damage to a rare natural site."}, {"fr": "La pollution des nappes phréatiques.", "en": "Pollution of groundwater."}, {"fr": "La raréfaction des énergies fossiles.", "en": "Scarcity of fossil fuels."}], "correct": 1}, {"number": 38, "options": [{"fr": "Mettre en place toutes les infrastructures d’accueil.", "en": "Set up all reception infrastructure."}, {"fr": "Prendre en compte des aspects financiers du projet.", "en": "Consider financial aspects of the project."}, {"fr": "Réussir l’intégration de la main-d’œuvre étrangère.", "en": "Successfully integrate foreign workers."}, {"fr": "Susciter l’adhésion de tous les habitants concernés.", "en": "Win the support of all affected residents."}], "correct": 0}, {"number": 39, "options": [{"fr": "Le nombre de médiateurs est insuffisant pour répondre à la demande.", "en": "There are too few mediators to meet demand."}, {"fr": "Les banques influencent les décisions prises par les médiateurs.", "en": "Banks influence mediators’ decisions."}, {"fr": "Les demandeurs trouvent que la procédure est trop longue et compliquée.", "en": "Applicants find the procedure too long and complex."}, {"fr": "Quelle que soit la nature du litige, le médiateur n’a qu’un pouvoir consultatif.", "en": "Whatever the dispute, the mediator only has an advisory role."}], "correct": 3}];const quiz=document.getElementById('quiz');let choices={};function render(){quiz.innerHTML='';questions.forEach((q,i)=>{let s=document.createElement('section');let h=document.createElement('h3');h.textContent='Question '+q.number;s.append(h);let p=document.createElement('p');p.textContent='Choisissez la bonne réponse. / Choose the correct answer.';s.append(p);q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<strong>'+String.fromCharCode(65+j)+'.</strong> '+o.fr+'<small>'+o.en+'</small>';b.onclick=()=>{if(choices[i]!==undefined)return;choices[i]=j;render()};if(choices[i]!==undefined){b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===choices[i])b.classList.add('wrong')}s.append(b)});if(choices[i]!==undefined){let f=document.createElement('p');f.className='feedback';f.textContent=choices[i]===q.correct?'✓ Correcte!':'✗ Incorrecte. Bonne réponse : '+String.fromCharCode(65+q.correct);s.append(f)}quiz.append(s)});document.getElementById('score').textContent='Score: '+questions.filter((q,i)=>choices[i]===q.correct).length+' / 9 · Answered '+Object.keys(choices).length+' / 9'}document.getElementById('retry').onclick=()=>{choices={};render();scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
